<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peeple – най-близката тоалетна</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--blue:#1265A8;--red:#F2543D;--bg:#F4F7FA;--card:#fff;--ink:#12263A;--mute:#5E7189;--green:#2E9E6B;--line:#DCE4ED}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",system-ui,sans-serif}
#app{position:relative;width:min(100%,410px);height:min(100%,820px);margin:0 auto;overflow:hidden;background:var(--bg)}
@media(min-width:500px){body{display:flex;align-items:center;justify-content:center}#app{border-radius:34px;box-shadow:0 20px 60px rgba(18,38,58,.28);border:8px solid #12263A}}
#map{position:absolute;inset:0}
.pin{width:36px;height:36px;border-radius:50%;background:#fff;border:3px solid;display:grid;place-items:center;font-size:18px;position:relative;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.pin.sel{transform:scale(1.25)}
.dot{position:absolute;top:-5px;right:-5px;width:13px;height:13px;border-radius:50%;border:2px solid #fff}
.me{width:18px;height:18px;border-radius:50%;background:#1265A8;border:3px solid #fff;box-shadow:0 0 0 9px rgba(18,101,168,.25)}
.chip{flex:none;padding:7px 12px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.btn{border-radius:14px;padding:12px 14px;font-weight:800;font-size:14px}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--mute)}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:1100;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);padding:10px 18px 18px;transform:translateY(110%);transition:transform .25s;max-height:78%;overflow:auto}
#sheet.open{transform:none}
.star{font-size:28px;line-height:1;color:var(--line);background:none;border:0;padding:2px;cursor:pointer}.star:hover,.star.h{color:#F5B301}
button{font-family:inherit;cursor:pointer}
.leaflet-tooltip{font-weight:800;background:var(--blue);color:#fff;border:0}.leaflet-tooltip-top:before{border-top-color:var(--blue)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <header class="absolute top-0 left-0 right-0 px-3 pt-3" style="z-index:1100;pointer-events:none">
    <div class="flex items-center justify-between mb-2" style="pointer-events:auto">
      <div class="flex items-center gap-2 rounded-2xl px-2 py-1 bg-white shadow">
        <div class="w-8 h-8 rounded-lg grid place-items-center text-white font-extrabold" style="background:var(--blue)">P</div>
        <div class="font-extrabold text-lg">Peeple</div></div>
      <div class="flex gap-2">
        <button id="locate" class="btn bg-white shadow" style="padding:8px 12px" aria-label="Обнови местоположението">📍</button>
        <button id="nearest" class="btn text-white shadow" style="background:var(--green);padding:8px 12px">Най-близка</button></div>
    </div>
    <div id="chips" class="flex gap-2 overflow-x-auto pb-1" style="scrollbar-width:none;pointer-events:auto">
      <button class="chip" data-f="acc">♿ Достъпна</button>
      <button class="chip" data-f="baby">🍼 Преповиване</button>
      <button class="chip" data-f="free">💶 Безплатна</button>
      <button class="chip" data-f="clean">🧼 Поддържана</button>
    </div>
  </header>
  <div id="nav" class="absolute left-3 right-3 hidden rounded-2xl text-white p-3 shadow-xl" style="top:110px;z-index:1100;background:var(--blue)">
    <div class="flex justify-between items-start gap-2">
      <div><div id="navTitle" class="font-extrabold"></div><div id="navStep" class="text-sm"></div><div id="navNext" class="text-sm opacity-80"></div></div>
      <button id="stop" class="btn" style="background:rgba(255,255,255,.2);padding:6px 10px">Спри</button></div>
  </div>
  <div id="loading" class="absolute left-1/2 hidden px-4 py-2 rounded-full bg-white shadow font-bold text-sm" style="top:112px;transform:translateX(-50%);z-index:1100">Търся тоалетни наблизо…</div>
  <div id="sheet" role="dialog" aria-live="polite"></div>
  <div id="toast" class="absolute left-1/2 px-4 py-2 rounded-full text-white text-sm font-bold opacity-0 pointer-events-none transition-opacity" style="bottom:90px;transform:translateX(-50%);background:var(--ink);z-index:1200;max-width:90%;text-align:center"></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
